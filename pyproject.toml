[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mightier-tone-agent"
version = "0.1.0"
description = "Tools and agents for transforming guitar tone descriptions into Mightier Amp QR codes"
readme = "README.md"
authors = [
    { name = "Mightier Tone Agent Contributors" }
]
license = { text = "GPL-3.0-or-later" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Multimedia :: Sound/Audio",
]
keywords = ["guitar", "amp-modeling", "nux", "mighty-plug", "mightier-amp", "qr-code", "tone-generator", "ai-agent"]
requires-python = ">=3.8"
dependencies = [
    "qrcode[pil]>=7.4.2",
    "pillow>=9.5.0",
]

[project.optional-dependencies]
decode = [
    "pyzbar>=0.1.9",
]
dev = [
    "pytest>=7.0",
]

[project.scripts]
gen-tone-qr = "gen_qr:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
